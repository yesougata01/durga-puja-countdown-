<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Durga Puja Countdown 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    color:white;
    background:#080000;
}

/* =========================
   DURGA MAA BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;

    background-image:
    linear-gradient(
        90deg,
        rgba(0,0,0,.88),
        rgba(40,0,0,.25),
        rgba(0,0,0,.82)
    ),
    url("https://images.unsplash.com/photo-1601058268499-e52658b8bb88?auto=format&fit=crop&w=2400&q=100");

    background-size:cover;
    background-position:center;
    transform:scale(1.08);

    animation:
        cinematicZoom 18s ease-in-out infinite alternate,
        backgroundGlow 6s ease-in-out infinite;

    filter:
        contrast(1.2)
        saturate(1.45)
        brightness(.82);
}

@keyframes cinematicZoom{
    0%{
        transform:scale(1.08);
        background-position:center;
    }

    100%{
        transform:scale(1.18);
        background-position:52% center;
    }
}

@keyframes backgroundGlow{
    0%,100%{
        filter:
        contrast(1.2)
        saturate(1.4)
        brightness(.78);
    }

    50%{
        filter:
        contrast(1.3)
        saturate(1.65)
        brightness(1);
    }
}

/* CINEMATIC DARK OVERLAY */

.overlay{
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at center,
        rgba(255,120,0,.12),
        rgba(30,0,0,.5) 45%,
        rgba(0,0,0,.9) 100%);

    animation:overlayPulse 5s infinite alternate;
}

@keyframes overlayPulse{
    from{
        opacity:.7;
    }
    to{
        opacity:1;
    }
}

/* =========================
   PARTICLES
========================= */

.particles{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.particle{
    position:absolute;
    width:5px;
    height:5px;
    background:#ffd36b;
    border-radius:50%;
    box-shadow:
        0 0 10px #ffb300,
        0 0 20px #ff6600;

    animation:floatParticle linear infinite;
}

@keyframes floatParticle{
    0%{
        transform:translateY(110vh) scale(.4);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-20vh) translateX(100px) scale(1.4);
        opacity:0;
    }
}

/* =========================
   MAIN CONTENT
========================= */

.container{
    position:relative;
    z-index:5;

    min-height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:20px;
}

.jai{
    color:#ffd36b;
    letter-spacing:7px;
    font-size:14px;
    margin-bottom:10px;

    text-shadow:
        0 0 10px #ff8c00,
        0 0 25px #ff4500;

    animation:textBlink 2s infinite;
}

@keyframes textBlink{
    0%,100%{
        opacity:.7;
    }

    50%{
        opacity:1;
    }
}

h1{
    font-family:'Cinzel',serif;
    font-size:clamp(45px,8vw,100px);
    line-height:1;

    background:linear-gradient(
        180deg,
        #fff7c5,
        #ffd35a,
        #ff9500,
        #ffdf8c
    );

    -webkit-background-clip:text;
    color:transparent;

    text-shadow:
        0 0 10px rgba(255,180,0,.8),
        0 0 30px rgba(255,90,0,.5);

    animation:titleFloat 3s ease-in-out infinite;
}

@keyframes titleFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}

.subtitle{
    margin-top:15px;
    font-size:clamp(14px,2vw,20px);
    letter-spacing:3px;
    color:#fff2cc;
    text-shadow:0 0 15px #ff7b00;
}

/* =========================
   COUNTDOWN
========================= */

.countdown{
    display:flex;
    gap:20px;
    margin-top:45px;
    justify-content:center;
    flex-wrap:wrap;
}

.time-box{
    position:relative;

    min-width:130px;
    padding:22px 15px;

    border-radius:18px;

    background:
    linear-gradient(
        145deg,
        rgba(255,190,60,.25),
        rgba(80,0,0,.35)
    );

    border:1px solid rgba(255,210,100,.6);

    backdrop-filter:blur(12px);

    box-shadow:
        0 0 20px rgba(255,100,0,.35),
        inset 0 0 20px rgba(255,170,0,.1);

    overflow:hidden;

    animation:boxGlow 3s infinite alternate;
}

.time-box::before{
    content:"";
    position:absolute;

    width:200%;
    height:50%;

    top:-100%;
    left:-50%;

    background:
    linear-gradient(
        transparent,
        rgba(255,255,255,.4),
        transparent
    );

    transform:rotate(25deg);

    animation:shine 4s infinite;
}

@keyframes shine{
    0%{
        top:-100%;
    }

    100%{
        top:150%;
    }
}

@keyframes boxGlow{
    from{
        box-shadow:
        0 0 15px rgba(255,100,0,.25),
        inset 0 0 10px rgba(255,200,0,.08);
    }

    to{
        box-shadow:
        0 0 35px rgba(255,160,0,.6),
        inset 0 0 25px rgba(255,200,0,.2);
    }
}

.number{
    position:relative;
    z-index:2;

    font-family:'Cinzel',serif;
    font-size:clamp(35px,5vw,65px);
    font-weight:800;

    color:#fff4c9;

    text-shadow:
        0 0 10px #ffb000,
        0 0 25px #ff5e00;
}

.label{
    position:relative;
    z-index:2;

    margin-top:5px;
    color:#ffd77a;

    font-size:12px;
    letter-spacing:3px;
}

/* =========================
   BOTTOM TEXT
========================= */

.bottom{
    position:absolute;
    bottom:25px;

    font-family:'Cinzel',serif;

    color:#ffd36b;
    font-size:13px;
    letter-spacing:4px;

    text-shadow:
        0 0 10px #ff7b00;

    animation:bottomPulse 2s infinite;
}

@keyframes bottomPulse{
    50%{
        opacity:.5;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .countdown{
        gap:10px;
        margin-top:30px;
    }

    .time-box{
        min-width:42%;
        padding:18px 10px;
    }

    .jai{
        letter-spacing:4px;
    }

    .bottom{
        font-size:10px;
        letter-spacing:2px;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="background"></div>

<!-- CINEMATIC OVERLAY -->
<div class="overlay"></div>

<!-- PARTICLES -->
<div class="particles" id="particles"></div>


<!-- MAIN CONTENT -->

<div class="container">

    <div class="jai">
        ✦ JAI MAA DURGA ✦
    </div>

    <h1>DURGA PUJA</h1>

    <div class="subtitle">
        THE DIVINE COUNTDOWN BEGINS
    </div>


    <!-- COUNTDOWN -->

    <div class="countdown">

        <div class="time-box">
            <div class="number" id="days">00</div>
            <div class="label">DAYS</div>
        </div>

        <div class="time-box">
            <div class="number" id="hours">00</div>
            <div class="label">HOURS</div>
        </div>

        <div class="time-box">
            <div class="number" id="minutes">00</div>
            <div class="label">MINUTES</div>
        </div>

        <div class="time-box">
            <div class="number" id="seconds">00</div>
            <div class="label">SECONDS</div>
        </div>

    </div>

</div>


<div class="bottom">
    ✦ SHUBHO MAHALAYA • SHUBHO DURGA PUJA • JAI MAA DURGA ✦
    ✦ PRESENTED BY SOUGATA HAKDER✦
</div>


<script>

/* =====================================
   COUNTDOWN DATE
   Change this date if required
===================================== */

const durgaPujaDate = new Date("October 18, 2026 00:00:00").getTime();


function updateCountdown(){

    const now = new Date().getTime();

    const distance = durgaPujaDate - now;


    if(distance <= 0){

        document.getElementById("days").innerHTML = "00";
        document.getElementById("hours").innerHTML = "00";
        document.getElementById("minutes").innerHTML = "00";
        document.getElementById("seconds").innerHTML = "00";

        document.querySelector(".subtitle").innerHTML =
        "✨ SHUBHO DURGA PUJA! ✨";

        return;
    }


    const days = Math.floor(
        distance / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
    );

    const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
    );

    const seconds = Math.floor(
        (distance % (1000 * 60)) /
        1000
    );


    document.getElementById("days").innerHTML =
    String(days).padStart(2,"0");

    document.getElementById("hours").innerHTML =
    String(hours).padStart(2,"0");

    document.getElementById("minutes").innerHTML =
    String(minutes).padStart(2,"0");

    document.getElementById("seconds").innerHTML =
    String(seconds).padStart(2,"0");

}


updateCountdown();

setInterval(updateCountdown,1000);



/* =====================================
   CREATE GOLDEN PARTICLES
===================================== */

const particleContainer =
document.getElementById("particles");


for(let i = 0; i < 70; i++){

    const particle =
    document.createElement("div");

    particle.classList.add("particle");


    particle.style.left =
    Math.random() * 100 + "vw";


    particle.style.animationDuration =
    (5 + Math.random() * 10) + "s";


    particle.style.animationDelay =
    (Math.random() * 10) + "s";


    particle.style.width =
    (2 + Math.random() * 6) + "px";


    particle.style.height =
    particle.style.width;


    particleContainer.appendChild(particle);

}

</script>

</body>
</html>
